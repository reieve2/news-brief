name: 每日早报

on:
  schedule:
    # GitHub 用 UTC；前一天 23:00 UTC = 北京时间当天 07:00
    # 定时任务可能延迟几十分钟到几小时，所以本地兜底放在 18:00 检查
    - cron: "0 23 * * *"
  push:
    paths:
      - '.github/workflows/daily-brief.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 云端直连（清空本地代理配置）
        run: |
          sed -i 's|^  proxy: http.*|  proxy: ""|' config.yaml
          grep -n "proxy:" config.yaml | head -2

      - name: 生成并部署早报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python src/main.py

      - name: 确认线上确实更新了
        run: |
          base=$(python -c "import yaml;print(yaml.safe_load(open('config.yaml'))['site']['base_url'])")
          today=$(date -u +%Y-%m-%d)
          for i in $(seq 1 6); do
            if curl -fsS "$base/?v=$RANDOM" | grep -q "$today"; then
              echo "线上已更新到 $today"
              exit 0
            fi
            echo "等待部署生效（$i/6）"
            sleep 20
          done
          echo "::error::线上页面没出现今天的日期，部署可能失败——检查 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID"
          exit 1

      - name: 把当期存档写回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "没有新的存档需要提交"
          else
            git commit -m "归档 $(date -u +%F) 的早报"
            git push
          fi

site:
  title: 每日 AI 科技早报
  base_url: https://daily-aibrief.pages.dev
  out_dir: out
brief:
  card_count: 7
  card_count_min: 5
  max_per_source: 2
  lookback_hours: 30
  timezone: Asia/Shanghai
  language: zh
  fetch_fulltext: true
  fulltext_max_chars: 6000
model:
  base_url: https://api.deepseek.com
  select_model: deepseek-chat
  compose_model: deepseek-chat
  temperature: 0.3
  max_candidates: 120
  summary_chars: 500
network:
  proxy: http://127.0.0.1:7897
  timeout: 15
  retries: 2
  workers: 8                # 并发抓取的线程数
  fetch_budget_seconds: 360 # 抓取总时间预算，超了就用手上已有的内容
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
    like Gecko) Chrome/124.0 Safari/537.36
deploy:
  enabled: true
  project_name: daily-aibrief
  branch: main
weekly:
  enabled: true
  run_in_cloud: false       # 云端（GitHub Actions）是否也做周报；本地做才需要 ffprobe
  digest_limit: 12          # 底稿条目总数的硬上限
  max_items_to_model: 30    # 合并后最多送多少条给模型挑选
  ffprobe: O:\ai-media\tools\ffmpeg\bin\ffprobe.exe
  ffmpeg: O:\ai-media\tools\ffmpeg\bin\ffmpeg.exe
  bgm: O:\ai-media\projects\aibrief-douyin\assets\bgm.wav   # 背景音乐素材，不足长度会自动循环
  bgm_volume: 0.12          # BGM 相对配音的音量
  gsap: O:\ai-media\projects\aibrief-douyin\assets\gsap.min.js
  ai_media_dir: O:\ai-media\projects   # 加 --copy 时把工程复制到这里，目录名 aibrief-weekly-*
  versions:
    douyin:
      seconds: 50          # 实测 324 字 ≈ 43 秒，50 秒是校验区间的中值
      max_items: 3
      word_budget: 300
      voice: zh-CN-YunjianNeural
      rate: "+15%"
      gap: 0.15
    bili:
      seconds: 180
      max_items: 9
      word_budget: 900
      voice: zh-CN-YunjianNeural
      rate: "+12%"
      gap: 0.4
notify:
  dingtalk: true
